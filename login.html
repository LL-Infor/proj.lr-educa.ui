<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGIN LR-EDUCA | Gestão Educacional</title>
  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
</head>

<body>
  <div class="login-container">

    <h1>
      <img src="assets/LogoLREducagren.png" alt="Logo LR-EDUCA">
    </h1>

    <p>Acesso ao Sistema de Gestão Educacional</p>

    <form id="formLogin">

      <label for="perfil">Perfil de Acesso</label>
      <select id="perfil" name="perfil" required>
        <option value="">Selecione o perfil</option>
        <option value="ADMIN">Admin(a)</option>
        <option value="DIRETOR">Diretor(a)</option>
        <option value="SUPERVISOR">Supervisor(a)</option>
        <option value="PROFESSOR">Professor(a)</option>
        <option value="COORDENADOR">Coordenador(a)</option>
        <option value="SECRETARIO">Secretário(a)</option>
      </select>

      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="email@instituicao.com"
        autocomplete="username"
        required
      >

      <label for="senha">Senha</label>

    <div class="senha-container">
      <input
        type="password"
        id="senha"
        name="senha"
        placeholder="Digite sua senha"
        autocomplete="current-password"
        required
      >

      <button
        type="button"
        id="toggleSenha"
        class="btn-senha"
        aria-label="Mostrar senha"
        aria-pressed="false"
      >
        Mostrar
      </button>
    </div>

      <p id="mensagem" class="mensagem" role="alert" aria-live="polite"></p>

      <button type="submit" id="btnEntrar" class="btn btn-login">
        Entrar
      </button>

      <button
        type="button"
        class="btn btn-voltar"
        onclick="window.location.href='./index.html'">
        Voltar
      </button>

      <div class="links">
        <a href="./esqueci-senha.html">Esqueci minha senha</a>
      </div>

    </form>

    <div class="footer-text">
      LR-EDUCA © 2026<br>
      Criadores: Grupo 01 – Capitão de Campos - PI
    </div>

  </div>
</body>
</html>
